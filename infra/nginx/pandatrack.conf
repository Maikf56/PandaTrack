# PandaTrack 生产入口（01 §3.2 形态 A：同机同域）
# 客户前端 pandatrack.ginzavog.com：/ 静态 + /api/ 反代 BFF(127.0.0.1:8100)
server {
    listen 80;
    server_name pandatrack.ginzavog.com pandaadmin.ginzavog.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pandatrack.ginzavog.com;

    ssl_certificate /etc/nginx/certs/ginzavog-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ginzavog-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;
    root /var/www/pandatrack/client;
    index index.html;

    # SSE：禁缓冲 + 长超时（01 §4）
    location /api/v1/events {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# 管理端 pandaadmin.ginzavog.com：独立服务块/Cookie 范围（01 §3.2）
server {
    listen 443 ssl http2;
    server_name pandaadmin.ginzavog.com;

    ssl_certificate /etc/nginx/certs/ginzavog-fullchain.pem;
